server:
  port: 8080

spring:
  main:
    lazy-initialization: true
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.format_sql: true
  flyway:
    enabled: true
  cache:
    type: ${CACHE_TYPE:redis}
    redis:
      time-to-live: 15m
  data:
    redis:
      repositories:
        enabled: false
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
app:
  jwt:
    secret: ${JWT_SECRET:dev-super-secret-change-me-please-32+chars}
    expirationSeconds: 3600
    refreshExpirationSeconds: 1209600
  seed:
    enabled: ${APP_SEED_ENABLED:false}
    mohamedEmail: "${APP_SEED_MOHAMEDEMAIL:}"
    mohamedDisplayName: "${APP_SEED_MOHAMEDISPLAYNAME:Mohamed}"
    mohamedPassword: "${APP_SEED_MOHAMEDPASSWORD:}"
    resetOnStart: ${APP_SEED_RESET_ON_START:false}
logging:
  level:
    org.springframework.security: INFO
mediatracker:
  tmdb:
    apiKey: ${TMDB_API_KEY}
  rawg:
    apiKey: ${RAWG_API_KEY}
