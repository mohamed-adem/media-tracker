name: Verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mt_user
          POSTGRES_PASSWORD: mt_pass
          POSTGRES_DB: mt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mt_user -d mt_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/mt_test
      SPRING_DATASOURCE_USERNAME: mt_user
      SPRING_DATASOURCE_PASSWORD: mt_pass
      JWT_SECRET: ci-only-secret-with-at-least-thirty-two-characters
      TMDB_API_KEY: ci-placeholder
      RAWG_API_KEY: ci-placeholder
      CACHE_TYPE: simple
      APP_SEED_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Test backend and migrations
        working-directory: backend/media-tracker-api
        run: ./gradlew test --no-daemon
      - name: Build backend artifact
        working-directory: backend/media-tracker-api
        run: ./gradlew bootJar --no-daemon

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  container:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t media-tracker-api:verify .
